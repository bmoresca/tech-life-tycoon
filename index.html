<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Life Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">TECH LIFE <span>TYCOON</span></div>
  <div class="stat" title="Date"><span class="ico">📅</span><b id="st-date">Jan 1, 1984</b></div>
  <div class="stat" title="Cash"><span class="ico">💵</span><b id="st-money">$15,000</b></div>
  <div class="stat" title="Fans"><span class="ico">👥</span><b id="st-fans">0</b></div>
  <div class="stat" title="Hype"><span class="ico">🔥</span><b id="st-hype">0</b></div>
  <div class="stat" title="Reputation"><span class="ico">⭐</span><b id="st-rep">0</b></div>
  <div class="stat" title="Research points"><span class="ico">🔬</span><b id="st-rp">0</b></div>
  <button id="btn-help" title="How to play">?</button>
  <div class="speed">
    <button data-speed="0" title="Pause">II</button>
    <button data-speed="1" class="on" title="Normal">▶</button>
    <button data-speed="2" title="Fast">▶▶</button>
    <button data-speed="4" title="Fastest">▶▶▶</button>
  </div>
</header>

<main>
  <section class="scene-wrap">
    <canvas id="scene" width="640" height="360"></canvas>
    <div class="status" id="status"></div>
  </section>
  <aside class="panel">
    <nav class="tabs">
      <button data-tab="dev" class="on">Develop</button>
      <button data-tab="contracts">Contracts</button>
      <button data-tab="post">Post</button>
      <button data-tab="research">Research</button>
      <button data-tab="team">Team</button>
      <button data-tab="company">Company</button>
      <button data-tab="products">Products</button>
    </nav>
    <div class="tab-body" id="tab-body"></div>
  </aside>
</main>

<footer class="log"><ul id="log"></ul></footer>

<div class="modal-back" id="modal"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="sprites.js"></script>
<script src="ui.js"></script>
</body>
</html>
